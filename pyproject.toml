[project]
name = "mix-automation"
version = "0.7.0"
description = "Reference-grade automated vocal mixing engine tailored for Studio One 5 & commercial VST3 chains"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "soundfile>=0.12.1",
    "librosa>=0.10.2",
    "pyloudnorm>=0.1.1",
    "pedalboard>=0.9.14",
    "praat-parselmouth>=0.4.5",
    "psola>=0.0.1",
    "optuna>=4.0.0",
    "cmaes>=0.11.0",
    "pydantic>=2.9.0",
    "typer>=0.12.5",
    "rich>=13.9.0",
    "pykakasi>=2.3.0",
    "mido>=1.3.2",
]

[project.optional-dependencies]
ml = [
    "torch>=2.4.0",
    "torchaudio>=2.4.0",
    "auraloss>=0.4.0",
    "dasp-pytorch>=0.0.1",
    "audio-separator[gpu]>=0.24.0",
    "onnxruntime-gpu>=1.19.0",
    "audioread>=3.0.0",
    "omegaconf>=2.3.0",
]
# v8 Phase 2 evaluation (scripts/analysis/evaluate_issues.py, build_reference_stats.py).
# Versions as installed and verified on 2026-11-26.
eval = [
    "beat-this==1.1.0",
    "einops==0.8.2",
    "soxr==1.1.0",
    "rotary-embedding-torch==0.6.5",
    "tqdm==4.70.1",
    "blind-rt60==0.1.1",
    "matplotlib==3.11.2",
    "faster-whisper==1.2.1",
    "pystoi==0.4.1",
]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.7.0",
]

[project.scripts]
mix-auto = "mix_automation.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mix_automation"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
addopts = "-p no:faulthandler"

[tool.uv]
environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]
